name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python and browser engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-repro.txt
            requirements-analysis.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install recorded dependency versions
        run: python -m pip install -r requirements-analysis.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Experiment protocol
        run: python scripts/validate_protocol.py
      - name: Browser inference engine
        run: node tests/test_browser_engine.mjs
      - name: Group feedback form
        run: node tests/test_hub_feedback.mjs
      - name: Offline archive download
        run: node tests/test_cloudflare_download.mjs
